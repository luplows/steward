name: Land approved PRs

# The merge half of OQ-42's review gate. `review-gate.yml` decides whether a PR
# is allowed to land; this decides nothing at all. Every condition below was
# already established by CI and by an independent reviewer -- this only notices
# that they hold, and acts.
#
# It exists because landing used to be the author's job, and a worker session
# finishes long before its verdict arrives. That assigned the work to something
# which no longer existed: #92 sat merge-ready with nobody responsible for
# noticing, and #93 only landed because someone happened to ask. Whatever runs
# this must therefore not depend on any session being alive.
#
# One PR per run, oldest first. GitHub recomputes mergeability asynchronously,
# so a second merge in the same run would be decided on `mergeable_state` read
# before the first one landed -- it would still say `clean` because nothing had
# recalculated yet. Stopping after one costs a few minutes and removes that
# whole class of mistake. Oldest first so a PR cannot be starved by newer ones.
#
# There is deliberately no `schedule:` trigger. It was `*/15`, and GitHub
# delivered roughly one run every five hours -- about 5% of the configured
# rate. That is the worst of both: too slow to rely on, yet automatic enough
# that nobody notices when it stops. Landing is explicit until a trigger that
# actually fires is chosen (OQ-50): `gh workflow run land-approved.yml`.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: read

# Never two sweeps at once: both would read the same pre-merge state.
concurrency:
  group: land-approved
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - name: Land the oldest ready PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Circuit breaker (OQ-42). Once five open PRs carry `review-blocked`,
          # something systemic is wrong -- a bad checklist, a bad reviewer, bad
          # prompts -- and landing more only spreads it.
          #
          # A tripped breaker narrows what may land; it does not stop landing
          # outright. OQ-42 requires the PR that fixes the jam to stay
          # landable, "or it becomes a trap escapable only by admin merge", and
          # since nothing else merges PRs any more, a breaker with no exemption
          # here would be exactly that trap. Two exemptions: an explicit
          # `breaker-override` label, or a diff confined to .github/workflows/,
          # which is where a fix to the gate itself would live. Neither
          # bypasses review -- an exempt PR still needs review/agent success
          # and green CI like any other. (These mirrored the now-deleted
          # review.yml, which enforced the same pair on the review half; see
          # Completed-Questions.md, OQ-42.)
          blocked_prs="$(gh api "repos/${REPO}/pulls?state=open&per_page=100" \
            --jq '[.[] | select([.labels[].name] | index("review-blocked"))] | length')"
          breaker_tripped=no
          if [ "${blocked_prs}" -ge 5 ]; then
            breaker_tripped=yes
            echo "::warning title=Circuit breaker tripped::${blocked_prs} open PRs carry review-blocked; landing only breaker-override or workflow-only PRs."
          fi

          candidates="$(gh api "repos/${REPO}/pulls?state=open&sort=created&direction=asc&per_page=100" \
            --jq '.[] | select(.draft | not) | select(.base.ref == "main") | .number')"

          if [ -z "${candidates}" ]; then
            echo "No open non-draft PRs against main."
            exit 0
          fi

          for pr in ${candidates}; do
            pr_json="$(gh api "repos/${REPO}/pulls/${pr}")"
            sha="$(printf '%s' "${pr_json}" | jq -r '.head.sha')"
            mergeable_state="$(printf '%s' "${pr_json}" | jq -r '.mergeable_state // "unknown"')"

            if printf '%s' "${pr_json}" | jq -e '[.labels[].name] | index("review-blocked")' >/dev/null; then
              echo "PR #${pr}: review-blocked, skipping"
              continue
            fi

            if [ "${breaker_tripped}" = yes ]; then
              if printf '%s' "${pr_json}" | jq -e '[.labels[].name] | index("breaker-override")' >/dev/null; then
                echo "PR #${pr}: breaker tripped, but carries breaker-override"
              else
                # An empty file list must not read as "touches only workflows",
                # so require at least one changed file as well as no file
                # outside .github/workflows/.
                changed="$(gh api "repos/${REPO}/pulls/${pr}/files?per_page=100" --paginate --jq '.[].filename')"
                outside="$(printf '%s\n' "${changed}" | grep -v '^\.github/workflows/' || true)"
                if [ -n "${changed}" ] && [ -z "${outside}" ]; then
                  echo "PR #${pr}: breaker tripped, but touches only .github/workflows/"
                else
                  echo "PR #${pr}: breaker tripped and no exemption, skipping"
                  continue
                fi
              fi
            fi

            # `clean` means mergeable, no conflict, and every *required* check
            # passing. `unknown` means GitHub has not finished computing it --
            # not a failure, just not an answer yet, so leave it for next run.
            if [ "${mergeable_state}" != "clean" ]; then
              echo "PR #${pr}: mergeable_state=${mergeable_state}, skipping"
              continue
            fi

            # Belt and braces. `clean` already implies this while `review/agent`
            # is a required status check -- but that setting silently went
            # missing once between being set and being checked the next
            # morning, and a sweep that lands unreviewed PRs whenever branch
            # protection lapses is worse than no sweep. Check it directly.
            verdict="$(gh api "repos/${REPO}/commits/${sha}/status" \
              --jq '.statuses[] | select(.context == "review/agent") | .state')"
            if [ "${verdict}" != "success" ]; then
              echo "PR #${pr}: review/agent=${verdict:-absent} on ${sha}, skipping"
              continue
            fi

            # --match-head-commit refuses the merge if anything was pushed
            # between the checks above and this call. A push would have reset
            # review/agent to pending anyway; this closes the window rather
            # than trusting it to be narrow.
            gh pr merge "${pr}" --repo "${REPO}" --squash --match-head-commit "${sha}"
            echo "::notice title=Landed::PR #${pr} merged at ${sha}"
            exit 0
          done

          echo "No PR ready to land."
