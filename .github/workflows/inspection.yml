name: Inspection

# Looks for a merge to `main` without a passing verdict, a commit on `main` without a pull request,
# and a pull request left pending or holding too long, and raises each as an issue labelled
# `inspection` (steward's `inspect` command; steward's design document, "Watchdog"). It checks
# each release branch as it checks `main`. It runs here so that it runs while the crew's machine
# is off.
#
# A project sets how often it runs by editing the schedule below, or drops it by deleting this
# file. On a private repository each run costs Actions minutes, rounded up to the next whole
# minute. A run exits 1 when it opened an issue, so that run shows as failed; that is the signal.
# GitHub delivers a schedule late and sometimes not at all (steward's design document,
# "Watchdog"), so read the cadence as "sometime".

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  # To check out the repository, so the settings (steward.config.json) can be read.
  contents: read
  # To read the open pull requests, and the pull requests of a commit, on `main` or a release
  # branch.
  pull-requests: read
  # To read the `review/agent` statuses.
  statuses: read
  # To list the `inspection` issues, open the ones that are missing, and create the label.
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        # Node 24 ships npm 11; the runner's default npm cannot install steward from GitHub.
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Inspect
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/dispatch/cli.mjs inspect
