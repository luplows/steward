name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_run:
    workflows: [Land approved PRs]
    types: [completed]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip a workflow_run started by a sweep that landed nothing (OQ-124): the
    # sweep moves main only on a merge, so an unchanged sha means no work to do.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_sha != github.sha
    steps:
      - name: 'Setup: checkout'
        uses: actions/checkout@v4
        with:
          # Full history: the story-diff containment check below needs the
          # pull request's base commit, which the default shallow (depth-1)
          # checkout of the merge commit does not reach (OQ-82).
          fetch-depth: 0
      - name: 'Setup: Node'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 'Setup: npm ci'
        run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Check story diff containment (OQ-82)
        if: github.event_name == 'pull_request'
        # The branch name is attacker-chosen text: pass it through env, not into
        # the shell (D-14).
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: >-
          node scripts/dispatch/story-containment.mjs
          ${{ github.event.pull_request.base.sha }}
          ${{ github.event.pull_request.head.sha }}
          "$HEAD_REF"
