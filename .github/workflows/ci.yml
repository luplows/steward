name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 'Setup: checkout'
        uses: actions/checkout@v4
        with:
          # Full history: the story-diff containment check below needs the
          # pull request's base commit, which the default shallow (depth-1)
          # checkout of the merge commit does not reach (OQ-82).
          fetch-depth: 0
      - name: 'Setup: Node'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 'Setup: npm ci'
        run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Check story diff containment (OQ-82)
        if: github.event_name == 'pull_request'
        run: >-
          node scripts/dispatch/story-containment.mjs
          ${{ github.event.pull_request.base.sha }}
          ${{ github.event.pull_request.head.sha }}
          ${{ github.head_ref }}
      - run: npm run build
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: 'Setup: cache Playwright browsers'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: 'Setup: Playwright browsers'
        timeout-minutes: 5
        run: |
          for attempt in 1 2; do
            echo "Playwright install attempt $attempt of 2"
            if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
              cmd="npx playwright install-deps chromium"
            else
              cmd="npx playwright install --with-deps chromium"
            fi
            if timeout 2m $cmd; then
              exit 0
            fi
            echo "Playwright install attempt $attempt failed or timed out"
          done
          exit 1
      - run: npm run test:e2e
      # A failing screenshot assertion (OQ-40) reports a pixel count in the
      # log; the expected/actual/diff images that make it diagnosable are in
      # the report.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
